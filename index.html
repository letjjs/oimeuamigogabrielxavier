<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>oimeuamigogabrielxavier</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: "Times New Roman", Times, serif;
    color: #000000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #ffffff;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
  .screen.active { display: flex; }

  /* Tela 1: interrogação */
  #question-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
  }
  #question-mark {
    font-size: 40vw;
    font-weight: bold;
    color: #000000;
    line-height: 1;
    user-select: none;
  }
  .point-arrow {
    font-size: 12vw;
    color: #f2c200;
    -webkit-text-stroke: 1.5px #000000;
    animation: point-bounce 1s infinite ease-in-out;
    user-select: none;
  }
  #arrow-left { animation-direction: normal; }
  #arrow-right { animation-direction: alternate-reverse; }
  @keyframes point-bounce {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3vw); }
  }
  #arrow-left { animation-name: point-bounce-left; }
  #arrow-right { animation-name: point-bounce-right; }
  @keyframes point-bounce-left {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3vw); }
  }
  @keyframes point-bounce-right {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-3vw); }
  }
  #tap-hint {
    margin-top: 3vh;
    font-size: 5vw;
    color: #000000;
  }

  /* Tela 2: escolha */
  .choice-btn {
    font-size: 22vw;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
    padding: 4vh 6vw;
    transition: transform 0.15s ease;
  }
  .choice-btn:active {
    transform: scale(0.85);
  }
  #choice-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4vw;
  }

  /* Tela 3: só o joinha gigante */
  #only-thumb {
    font-size: 55vw;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
    transition: transform 0.15s ease;
  }
  #only-thumb:active {
    transform: scale(0.9);
  }

  /* Tela 4: contagem */
  #countdown-number {
    font-size: 45vw;
    font-weight: bold;
    color: #f2c200;
    -webkit-text-stroke: 3px #000000;
  }

  /* Tela 5: resultado final */
  #result-screen {
    background: #fff4cc;
    overflow: hidden;
  }
  #result-image {
    max-width: 85vw;
    max-height: 70vh;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
  }
  .banana {
    position: absolute;
    bottom: -10vh;
    font-size: 8vw;
    animation-name: float-up;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    z-index: 1;
    user-select: none;
  }
  @keyframes float-up {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-120vh) rotate(360deg);
      opacity: 0.9;
    }
  }
</style>
</head>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Tela 1 -> Tela 2, ao clicar na interrogação
  document.getElementById('question-mark').addEventListener('click', () => {
    showScreen('screen-choice');
  });

  // Botão 👍 direto
  document.getElementById('btn-up').addEventListener('click', startCountdown);

  // Botão 👎 -> mostra só o joinha gigante
  document.getElementById('btn-down').addEventListener('click', () => {
    showScreen('screen-only-thumb');
  });

  // Joinha gigante -> mesma coisa que 👍
  document.getElementById('only-thumb').addEventListener('click', startCountdown);

  function startCountdown() {
    showScreen('screen-countdown');
    let count = 10;
    const el = document.getElementById('countdown-number');
    el.textContent = count;
    const interval = setInterval(() => {
      count--;
      if (count >= 1) {
        el.textContent = count;
      } else {
        clearInterval(interval);
        showFinalResult();
      }
    }, 1000);
  }

  function showFinalResult() {
    showScreen('result-screen');
    spawnBananas();
  }

  function spawnBananas() {
    const stage = document.getElementById('result-screen');
    const totalBananas = 40;
    for (let i = 0; i < totalBananas; i++) {
      setTimeout(() => {
        const banana = document.createElement('div');
        banana.className = 'banana';
        banana.textContent = '🍌';
        banana.style.left = Math.random() * 100 + 'vw';
        const duration = 3 + Math.random() * 3;
        banana.style.animationDuration = duration + 's';
        banana.style.fontSize = (5 + Math.random() * 6) + 'vw';
        stage.appendChild(banana);
        setTimeout(() => banana.remove(), duration * 1000);
      }, i * 200);
    }
    // continua gerando bananas indefinidamente
    setInterval(() => {
      const banana = document.createElement('div');
      banana.className = 'banana';
      banana.textContent = '🍌';
      banana.style.left = Math.random() * 100 + 'vw';
      const duration = 3 + Math.random() * 3;
      banana.style.animationDuration = duration + 's';
      banana.style.fontSize = (5 + Math.random() * 6) + 'vw';
      stage.appendChild(banana);
      setTimeout(() => banana.remove(), duration * 1000);
    }, 400);
  }
</script>
